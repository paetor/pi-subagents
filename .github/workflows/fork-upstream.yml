name: Fork upstream watch

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-upstream-watch
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'paetor/pi-subagents'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Discover stable upstream
        run: node scripts/fork-maintenance.mjs discover
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-discovery-${{ github.run_attempt }}
          path: .fork-ci/upstream.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
